services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vpro-backend
    ports:
      - "8001:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      FRONTEND_URL: ${FRONTEND_URL}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: vpro-frontend
    ports:
      - "8081:80"
    depends_on:
      - backend
    restart: unless-stopped